version: '3.8'

services:
  # 1. SERVICIO DE BASE DE DATOS
  db:
    image: postgres:15-alpine
    container_name: diabetes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-diabetes

  # 2. SERVICIO DEL BACKEND (FastAPI + modelo ML)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetes_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${API_KEY}
    volumes:
      - ./backend:/app
      - ./models:/app/models
    networks:
      - red-diabetes

  # 3. SERVICIO DEL FRONTEND
  frontend:
    image: nginx:alpine
    container_name: diabetes_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - red-diabetes

volumes:
  postgres_data:

networks:
  red-diabetes:
    driver: bridge
