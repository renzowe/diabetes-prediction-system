# Despliegue en Render: backend (Docker) y frontend (sitio estático). La base de datos está en Neon.
services:
  - type: web
    name: diabetes-hba1c-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://diabetes-hba1c-web.onrender.com"]'

  - type: web
    name: diabetes-hba1c-web
    runtime: static
    staticPublishPath: ./frontend
